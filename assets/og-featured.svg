<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#020817" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Category Kicker Pill -->
  <g transform="translate(100, 110)">
    <rect width="260" height="42" rx="21" fill="#D90429" />
    <circle cx="28" cy="21" r="6" fill="#FFFFFF" />
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="2">VERIFIED INTELLIGENCE</text>
  </g>

  <!-- Main Headline Brand -->
  <text x="100" y="250" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1">WHAT IS IN NEWS TODAY</text>
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#93C5FD">Noise-Free Daily Briefings &amp; Top 10 Viral Trends</text>

  <!-- 3 Smart Brevity Badges -->
  <g transform="translate(100, 380)">
    <g transform="translate(0, 0)">
      <rect width="290" height="64" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="32" r="5" fill="#3B82F6" />
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">3-Bullet Fact Verification</text>
    </g>

    <g transform="translate(310, 0)">
      <rect width="290" height="64" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="32" r="5" fill="#EAB308" />
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Why It Matters Analysis</text>
    </g>

    <g transform="translate(620, 0)">
      <rect width="320" height="64" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="32" r="5" fill="#EC4899" />
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Top 10 Social Pulse Radar</text>
    </g>
  </g>

  <!-- Footer Domain & Preferred Badge -->
  <g transform="translate(100, 520)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="1" />
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">whatisinnewstoday.com</text>
    <text x="1000" y="44" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94A3B8">Auto-refreshed every 30m • Primary Source Wires</text>
  </g>
</svg>
